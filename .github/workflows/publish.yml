name: Publish scheduled issues

# Daily at 11:15 UTC (early morning in Texas), on every push to main, and on demand.
# Order matters: the released post and its PDF are committed BEFORE the GitHub Release is
# created, so the release (and the Zenodo archive made from it) contains them.
on:
  schedule:
    - cron: "15 11 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install publishing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography markdown playwright pyyaml requests
          python -m playwright install --with-deps chromium

      - name: Check the DRAFTS_KEY secret can unlock the scheduled posts
        env:
          DRAFTS_KEY: ${{ secrets.DRAFTS_KEY }}
        run: python code/release_due.py --check-key

      - name: Release scheduled posts whose date has arrived
        env:
          DRAFTS_KEY: ${{ secrets.DRAFTS_KEY }}
        run: python code/release_due.py

      - name: Add Zenodo DOIs minted since the last run
        continue-on-error: true
        run: python code/find_dois.py

      - name: Build published site
        run: python site/build.py --final

      - name: Render issue PDFs
        run: python code/render_pdfs.py

      - name: Write release notes
        run: python code/release_notes.py

      - name: Commit and push the released post, PDF, DOIs, site, and notes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A posts scheduled docs pdf RELEASE_NOTES.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Publish scheduled content and rebuild site"
            git push
          fi

      - name: Create GitHub releases for Zenodo archiving
        env:
          GH_TOKEN: ${{ github.token }}
        run: python code/release_notes.py --github
